services:
  preview-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fluentloop_preview
      POSTGRES_USER: fluentloop_preview
      POSTGRES_PASSWORD: ${PREVIEW_POSTGRES_PASSWORD:?Set PREVIEW_POSTGRES_PASSWORD in your private .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - preview_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluentloop_preview -d fluentloop_preview"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  preview-redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  preview-mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:8026:8025"
      - "127.0.0.1:1026:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  preview-backend:
    networks: [default, preview-speech-internal]
    volumes:
      - preview_speech_audio_data:/var/lib/fluentloop/audio
    image: fluentloop-preview-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      preview-db:
        condition: service_healthy
      preview-redis:
        condition: service_healthy
      preview-mailpit:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_NAME: FluentLoop AI Draft Preview
      AI_PROVIDER: ollama
      SPEECH_WORKER_URL: http://preview-speech-worker:8090
      SPEECH_WORKER_TOKEN: ${PREVIEW_SPEECH_WORKER_TOKEN:-}
      SPEECH_STORAGE_PATH: /var/lib/fluentloop/audio
      SPEECH_MAX_UPLOAD_BYTES: ${SPEECH_MAX_UPLOAD_BYTES:-5000000}
      SPEECH_MAX_DURATION_SECONDS: ${SPEECH_MAX_DURATION_SECONDS:-30}
      SPEECH_PROCESSING_TIMEOUT_SECONDS: ${SPEECH_PROCESSING_TIMEOUT_SECONDS:-60}
      SPEECH_AUDIO_RETENTION_HOURS: ${SPEECH_AUDIO_RETENTION_HOURS:-24}
      SPEECH_TTS_VOICE: ${SPEECH_TTS_VOICE:-fr_FR-siwis-medium}
      OLLAMA_BASE_URL: ${PREVIEW_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${PREVIEW_OLLAMA_MODEL:-}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-60}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-600}
      AI_MAX_CONCURRENT_REQUESTS: "1"
      APP_VERSION: 0.1.0
      DATABASE_URL: ${PREVIEW_DATABASE_URL:?Set PREVIEW_DATABASE_URL in your private .env}
      REDIS_URL: redis://preview-redis:6379/0
      CORS_ORIGINS: '["http://localhost:3001","http://127.0.0.1:3001"]'
      FRONTEND_ORIGIN: http://localhost:3001
      SESSION_COOKIE_NAME: fluentloop_preview_session
      CSRF_COOKIE_NAME: fluentloop_preview_csrf
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      ENABLE_DRAFT_LEARNING_PREVIEW: "true"
      DEV_REGISTER_LIMIT: "30"
      SMTP_HOST: preview-mailpit
      SMTP_PORT: "1025"
      SMTP_STARTTLS: "false"
      EMAIL_FROM: FluentLoop Preview <no-reply@fluentloop.local>
      LOG_LEVEL: INFO
    ports:
      - "127.0.0.1:8001:8000"
    command:
      - sh
      - -c
      - alembic upgrade head && python -m app.content_import --apply && uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import json, sys, urllib.request; response = urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=5); sys.exit(0 if json.load(response).get('status') == 'ok' else 1)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  preview-frontend:
    image: fluentloop-preview-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      preview-backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8001/api/v1
      NEXT_PUBLIC_CSRF_COOKIE_NAME: fluentloop_preview_csrf
    ports:
      - "127.0.0.1:3001:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  preview-speech-worker:
    profiles: [speech]
    build:
      context: ./backend
      dockerfile: Dockerfile.speech
    networks: [preview-speech-internal]
    environment:
      SPEECH_MODEL_PATH: /models
      SPEECH_MAX_UPLOAD_BYTES: ${SPEECH_MAX_UPLOAD_BYTES:-5000000}
      SPEECH_MAX_DURATION_SECONDS: ${SPEECH_MAX_DURATION_SECONDS:-30}
      SPEECH_PROCESSING_TIMEOUT_SECONDS: ${SPEECH_PROCESSING_TIMEOUT_SECONDS:-60}
      SPEECH_WORKER_TOKEN: ${PREVIEW_SPEECH_WORKER_TOKEN:-}
      SPEECH_ASR_MODEL: ${SPEECH_ASR_MODEL:-tiny}
      SPEECH_ASR_DEVICE: cpu
      SPEECH_ASR_COMPUTE_TYPE: int8
      SPEECH_TTS_VOICE: ${SPEECH_TTS_VOICE:-fr_FR-siwis-medium}
    volumes:
      - ./.speech-models:/models:ro
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://localhost:8090/health',headers={'X-Speech-Key':os.environ['SPEECH_WORKER_TOKEN']}); urllib.request.urlopen(r,timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  preview-speech-internal:
    internal: true

volumes:
  preview_speech_audio_data:
  preview_postgres_data:
