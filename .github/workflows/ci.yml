name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python scripts/create_local_env.py --ci --database-host 127.0.0.1
      - run: docker compose up -d --wait db redis mailpit
      - run: python -m pip install -r backend/requirements.txt
      - working-directory: backend
        run: python -m alembic upgrade head
      - working-directory: backend
        run: python -m pytest tests -ra
      # Only this disposable GitHub-hosted runner's volumes are removed.
      - if: always()
        run: docker compose down -v
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/create_local_env.py --ci
      - run: docker compose up -d --wait db redis mailpit
      - run: docker compose build backend
      - run: docker compose exec -T db createdb -U "$POSTGRES_USER" fluentloop_e2e
      - name: Start isolated API for browser tests
        run: |
          docker compose run -d --no-deps --name fluentloop-e2e-backend \
            -p 127.0.0.1:8001:8000 \
            -e APP_ENV=test \
            -e DATABASE_URL="$BROWSER_TEST_DATABASE_URL" \
            -e REDIS_URL=redis://redis:6379/0 \
            -e FRONTEND_ORIGIN=http://127.0.0.1:3001 \
            backend sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8001/api/v1/health/ready >/dev/null; then exit 0; fi
            sleep 2
          done
          echo 'Isolated API did not become ready.'
          exit 1
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npm run test:e2e
      - if: always()
        run: docker rm -f fluentloop-e2e-backend || true
      # Only this disposable GitHub-hosted runner's volumes are removed.
      - if: always()
        run: docker compose down -v
